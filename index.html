<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <style>
      :root {
        --primary-color: #42b354;
        --text-color: #ffffff;
        --border-color: rgba(255, 255, 255, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background-color: #000000;
        background-image: url("./bg.png");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: var(--text-color);
        font-family: Arial, sans-serif;
      }

      .site-header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        min-height: 76px;
        padding: 0 6%;
        border-bottom: 1px solid var(--border-color);
      }

      .logo {
        color: #42b354;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-decoration: none;
      }

      .main-nav {
        display: flex;
        gap: 2rem;
      }

      .main-nav a {
        position: relative;
        color: var(--text-color);
        font-size: 0.95rem;
        text-decoration: none;
      }

      .main-nav a::after {
        position: absolute;
        right: 0;
        bottom: -0.55rem;
        left: 0;
        height: 3px;
        border-radius: 999px;
        background-color: var(--primary-color);
        content: "";
        opacity: 0;
        transform: scaleX(0.35);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .main-nav a.active::after,
      .main-nav a:focus-visible::after {
        opacity: 1;
        transform: scaleX(1);
      }

      .main-nav a:hover,
      .main-nav a:focus-visible {
        color: var(--primary-color);
      }

      .sign-up {
        justify-self: end;
        padding: 0.75rem 1.35rem;
        border-radius: 999px;
        background-color: #42b354;
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
      }

      .sign-up:hover,
      .sign-up:focus-visible {
        background-color: #42b354;
      }

      @media (max-width: 700px) {
        .site-header {
          grid-template-columns: 1fr auto;
          gap: 1rem;
          padding: 1rem 5%;
        }

        .main-nav {
          grid-column: 1 / -1;
          grid-row: 2;
          justify-content: center;
          flex-wrap: wrap;
          gap: 0.75rem 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="#home" aria-label="Home">GDF</a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#products">Products</a>
        <a href="#benefits">Benefits</a>
        <a href="#contact">Contact</a>
      </nav>

      <a class="sign-up" href="#sign-up">Sign up</a>
    </header>

    <script>
      const navigationLinks = document.querySelectorAll(".main-nav a");

      navigationLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navigationLinks.forEach((item) => item.classList.remove("active"));
          link.classList.add("active");
        });
      });
    </script>
  </body>
</html>
